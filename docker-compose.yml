services:
  postgres:
    image: postgres:16-alpine
    container_name: drugstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: the_watcher
      POSTGRES_USER: drugstore
      POSTGRES_PASSWORD: drugstore_dev
    ports:
      - "5433:5432"
    volumes:
      - drugstore-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drugstore -d the_watcher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  drugstore-postgres-data:
