name: Daily notification scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-scheduler
  cancel-in-progress: false
jobs:
  check-config:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch due notifications
        env:
          NOTIFY_SCHEDULE_SECRET: ${{ secrets.NOTIFY_SCHEDULE_SECRET }}
        run: |
          test -n "$NOTIFY_SCHEDULE_SECRET"
          curl --fail-with-body --silent --show-error --max-time 90 \
            --request POST \
            --header "Authorization: Bearer $NOTIFY_SCHEDULE_SECRET" \
            https://drug-store-pi.vercel.app/api/notifications/scheduled
